spring:
  application:
    name: ticket-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://ticket-postgres:5432/etdb-tickets}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/eventticketingmongo?authSource=admin}
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: 6379
      password: ${SPRING_DATA_REDIS_PASSWORD:redispass}
  cassandra:
    contact-points: ${SPRING_CASSANDRA_CONTACT_POINTS:localhost}
    port: ${SPRING_CASSANDRA_PORT:9042}
    local-datacenter: ${SPRING_CASSANDRA_LOCAL_DATACENTER:datacenter1}
    keyspace-name: ${SPRING_CASSANDRA_KEYSPACE_NAME:eventticketingks}
    schema-action: CREATE_IF_NOT_EXISTS
  mongodb:
    uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@localhost:27017/eventticketingmongo?authSource=admin}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
  web:
    error:
      include-message: always
      include-binding-errors: always

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw=}
  expiration: ${JWT_EXPIRATION_MS:86400000}

feign:
  booking-service:
    url: ${FEIGN_BOOKING_SERVICE_URL:http://booking-service:8080}
  event-service:
    url: ${FEIGN_EVENT_SERVICE_URL:http://event-service:8080}
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://user-service:8080}
  ticket-service:
    url: ${FEIGN_TICKET_SERVICE_URL:http://ticket-service:8080}
  sales-service:
    url: ${FEIGN_SALES_SERVICE_URL:http://sales-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

loki:
  url: ${LOKI_URL:http://loki:3100}

logging:
  level:
    com.team7.eventticketing.ticket: DEBUG
