spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**
            - id: event-service
              uri: http://event-service:8080
              predicates:
                - Path=/api/events/**
            - id: booking-service
              uri: http://booking-service:8080
              predicates:
                - Path=/api/bookings/**
            - id: ticket-service
              uri: http://ticket-service:8080
              predicates:
                - Path=/api/tickets/**
            - id: sales-service
              uri: http://sales-service:8080
              predicates:
                - Path=/api/sales/**

          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins: "*"
                allowedMethods: "*"
                allowedHeaders: "*"

# Service URLs (overridden per environment
services:
  user:
    url: http://user-service:8080
  event:
    url: http://event-service:8080
  booking:
    url: http://booking-service:8080
  ticket:
    url: http://ticket-service:8080
  sales:
    url: http://sales-service:8080

jwt:
  secret: ${JWT_SECRET}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    export:
      prometheus:
        enabled: true