# ==============================================================================
# k8s/api-gateway/gateway-service.yaml
# ==============================================================================
# NodePort 30080 exposes the gateway on the Minikube node IP.
# Access via: http://$(minikube ip):30080
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: eventticketing
  labels:
    app: api-gateway
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      protocol: TCP
      port: 8080          # cluster-internal port (other pods use this)
      targetPort: 8080    # container port
      nodePort: 30080     # external port on the Minikube node IP