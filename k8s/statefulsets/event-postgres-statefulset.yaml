apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: event-postgres
  namespace: eventticketing
spec:
  serviceName: "event-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: event-postgres
  template:
    metadata:
      labels:
        app: event-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: event-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi