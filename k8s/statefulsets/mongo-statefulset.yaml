# ==============================================================================
# k8s/statefulsets/mongo-statefulset.yaml
# ==============================================================================
# Single shared MongoDB instance — per M3 spec §1.3:
# "NoSQL databases — shared instance, separate ownership"
#
# Used by: Observer pattern event logging (M2), and any service that stores
# unstructured/document data (e.g. audit logs, event snapshots).
#
# Accessed inside the cluster at: mongodb.eventticketing.svc.cluster.local:27017
# or short form: mongodb:27017  (within the same namespace)
# ==============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: eventticketing
  labels:
    app: mongodb
spec:
  serviceName: mongodb     # Must match the headless Service name below
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: mongo:6
          ports:
            - containerPort: 27017
              name: mongo

          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: MONGO_ROOT_PASSWORD

          volumeMounts:
            - name: data
              mountPath: /data/db

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "300m"

          # MongoDB doesn't have a built-in HTTP health endpoint.
          # We use mongosh (included in mongo:6) to check connectivity.
          readinessProbe:
            exec:
              command:
                - mongosh
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - mongosh
                - "--eval"
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3

  # PVC template — K8s creates one PVC per replica automatically
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        # storageClassName: standard   # Minikube provides "standard" by default; omit to use default SC