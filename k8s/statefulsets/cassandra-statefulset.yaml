apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cassandra
  namespace: eventticketing
spec:
  serviceName: cassandra
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: cassandra:latest
          ports:
            - containerPort: 9042
              name: cql
          env:
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "128M"
            - name: CASSANDRA_CLUSTER_NAME
              value: "EventTicketing"
            - name: CASSANDRA_DC
              value: "datacenter1"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1280Mi" # Tight but enough breathing room for off-heap allocations
              cpu: "1"
          volumeMounts:
            - name: cassandra-storage
              mountPath: /var/lib/cassandra
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nodetool status | grep UN"
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - "nodetool status | grep UN"
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 10
      volumes:
        - name: cassandra-storage
          persistentVolumeClaim:
            claimName: cassandra-pvc