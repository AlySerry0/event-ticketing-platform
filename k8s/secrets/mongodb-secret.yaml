apiVersion: v1
kind: Secret
metadata:
  name: mongodb-secret
  namespace: eventticketing
type: Opaque
stringData:
  MONGO_ROOT_USERNAME: admin
  # !! Replace with a strong password !!
  MONGO_ROOT_PASSWORD: "REPLACE_WITH_STRONG_MONGO_PASSWORD"