apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
data:
  # General Spring Boot Settings
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"

  # Database & Cache (Standard naming for microservices)
  SPRING_DATASOURCE_URL: "jdbc:postgresql://booking-db:5432/etdb-bookings"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"

  # Phase 2 & 3: RabbitMQ Connection for Saga Events
  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"

  # Phase 4: Feign Client URLs
  FEIGN_EVENT_SERVICE_URL: "http://event-service:8080"
  FEIGN_USER_SERVICE_URL: "http://user-service:8080"
  FEIGN_TICKET_SERVICE_URL: "http://ticket-service:8080"