apiVersion: v1
kind: ConfigMap
metadata:
  name: booking-service-config
data:
  SERVER_PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"

  SPRING_DATASOURCE_URL: "jdbc:postgresql://booking-postgres:5432/etdb-bookings"
  SPRING_REDIS_HOST: "redis"
  SPRING_REDIS_PORT: "6379"

  SPRING_RABBITMQ_HOST: "rabbitmq"
  SPRING_RABBITMQ_PORT: "5672"
  SPRING_RABBITMQ_USERNAME: "guest"
  SPRING_RABBITMQ_PASSWORD: "guest"

  FEIGN_EVENT_SERVICE_URL: "http://event-service:8080"
  FEIGN_USER_SERVICE_URL: "http://user-service:8080"
  FEIGN_TICKET_SERVICE_URL: "http://ticket-service:8080"
  FEIGN_SALES_SERVICE_URL: "http://sales-service:8080"
