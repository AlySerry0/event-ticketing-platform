# ==============================================================================
# k8s/services/mongo-svc.yaml
# ==============================================================================
# Headless service (clusterIP: None) is REQUIRED for StatefulSets.
# It gives each pod a stable DNS name:
#   mongodb-0.mongodb.eventticketing.svc.cluster.local
#
# Other services connect using: mongodb:27017  (short form, same namespace)
# Connection string format (for Spring Data MongoDB):
#   mongodb://admin:<password>@mongodb:27017/<dbname>?authSource=admin
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: eventticketing
  labels:
    app: mongodb
spec:
  clusterIP: None       # Headless — required for StatefulSet stable DNS
  selector:
    app: mongodb
  ports:
    - name: mongo
      protocol: TCP
      port: 27017
      targetPort: 27017