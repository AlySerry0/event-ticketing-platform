apiVersion: v1
kind: ConfigMap
metadata:
  name: event-service-scrape-job
  namespace: monitoring
data:
  # Add this scrape_configs entry to your Prometheus ConfigMap.
  scrape-job.yaml: |
    - job_name: 'event-service'
      metrics_path: '/actuator/prometheus'
      scrape_interval: 15s
      scrape_timeout: 10s
      static_configs:
        - targets:
            - 'event-service.eventticketing.svc.cluster.local:8080'
          labels:
            service: 'event-service'
            namespace: 'eventticketing'
            team: 'S2'
