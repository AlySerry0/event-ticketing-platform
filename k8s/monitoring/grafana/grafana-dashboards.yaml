apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'Event Ticketing'
        orgId: 1
        folder: 'Microservices'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
  user-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Error Rate \u2014 user-service (LogQL)",
          "description": "Count of ERROR-level log lines per minute. Spike = something is broken.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "sum(rate({service=\"user-service\"} | json | level=\"ERROR\" [1m]))",
              "legendFormat": "errors/min",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "fixed",
                "fixedColor": "red"
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "title": "Authentication Events (LogQL)",
          "description": "REGISTERED and LOGGED_IN events over time \u2014 monitors auth traffic.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "sum by(action) (count_over_time({service=\"user-service\"} | json | message=~\".*REGISTERED.*|.*LOGGED_IN.*\" [5m]))",
              "legendFormat": "{{action}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "HTTP request rate (PromQL)",
          "description": "Requests per second to each user-service endpoint.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{job=\"user-service\"}[5m]))",
              "legendFormat": "{{uri}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP P99 latency (PromQL)",
          "description": "99th-percentile request duration per endpoint.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"user-service\"}[5m])))",
              "legendFormat": "p99 {{uri}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "Booking Service Feign Errors (LogQL)",
          "description": "Detects when event-service or booking-service is degraded.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "count_over_time({service=\"user-service\"} | json | logger=~ \".*Client.*\" | level=\"WARN\" [1m])",
              "legendFormat": "feign-warn/min",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "JVM Heap Used (PromQL)",
          "description": "Heap usage monitor to detect memory leaks.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(jvm_memory_used_bytes{job=\"user-service\", area=\"heap\"})",
              "legendFormat": "heap used"
            }
          ]
        },
        {
          "id": 7,
          "title": "HikariCP \u2014 active DB connections (PromQL)",
          "description": "Active vs. idle JDBC connections to user-postgres.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "hikaricp_connections_active{job=\"user-service\"}",
              "legendFormat": "active"
            }
          ]
        },
        {
          "id": 8,
          "title": "Request Log Volume by Path (LogQL)",
          "description": "Identifies high-traffic paths via logs.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "sum by(requestPath) (count_over_time({service=\"user-service\"} | json | requestPath != \"\" [5m]))",
              "legendFormat": "{{requestPath}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 9,
          "title": "Correlation ID Trace (LogQL \u2014 Explore)",
          "description": "Trace a single request across the cluster.",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 32,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{service=\"user-service\"} | json | correlationId=\"$correlationId\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "eventticketing",
        "user-service",
        "m3"
      ],
      "templating": {
        "list": [
          {
            "name": "correlationId",
            "type": "textbox",
            "label": "Correlation ID",
            "description": "Paste a correlationId to trace a specific request"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "User Service \u2014 M3 Integrated Dashboard",
      "uid": "user-service-integrated",
      "version": 1
    }
  event-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "id": 1,
          "title": "Event Service Request Rate (PromQL)",
          "description": "Requests per second to event-service endpoints.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{job=\"event-service\"}[5m]))",
              "legendFormat": "{{uri}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Event Service 5xx Error Rate (PromQL)",
          "description": "Tracks internal server errors in event-service.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"event-service\",status=~\"5..\"}[5m]))",
              "legendFormat": "5xx/min"
            }
          ]
        },
        {
          "id": 3,
          "title": "Event Service P95 Latency (PromQL)",
          "description": "95th percentile latency for event-service requests.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job=\"event-service\"}[5m])) by (le))",
              "legendFormat": "p95 latency"
            }
          ]
        },
        {
          "id": 4,
          "title": "RabbitMQ Routing Keys (LogQL)",
          "description": "Tracks published/consumed RabbitMQ routing keys.",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "sum by (routingKey) (count_over_time({service=\"event-service\"} | json | routingKey != \"\" [5m]))",
              "legendFormat": "{{routingKey}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "Session Verification Events (LogQL)",
          "description": "Tracks S2-F8 verification activity.",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "count_over_time({service=\"event-service\"} |= \"SESSION_VERIFIED\" [5m])",
              "legendFormat": "session-verifications",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "Correlation ID Trace (LogQL)",
          "description": "Trace one request across event-service logs.",
          "type": "logs",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 24,
            "h": 10
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "expr": "{service=\"event-service\"} | json | correlationId=\"$correlationId\"",
              "refId": "A"
            }
          ],
          "options": {
            "showTime": true,
            "showLabels": true,
            "wrapLogMessage": true
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": [
        "eventticketing",
        "event-service",
        "m3"
      ],
      "templating": {
        "list": [
          {
            "name": "correlationId",
            "type": "textbox",
            "label": "Correlation ID",
            "description": "Paste a correlationId to trace a request"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Event Service — M3 Integrated Dashboard",
      "uid": "event-service-integrated",
      "version": 1
    }
  booking-dashboard.json: |
    {
      "__inputs": [],
      "__requires": [],
      "annotations": { "list": [] },
      "description": "Booking Service — LogQL observability panels",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "panels": [
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Count of ERROR-level log lines from booking-service per minute. Spike detection — sudden rise indicates an unhandled exception or downstream failure.",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2 } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "id": 1,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({app=\"eventticketing\", service=\"booking-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min",
              "refId": "A"
            }
          ],
          "title": "Error Rate — booking-service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Feign call outcomes from booking-service: successful downstream responses vs FeignException catches. A rising exception count indicates a degraded upstream (event-service, user-service, or ticket-service).",
          "fieldConfig": {
            "defaults": { "color": { "mode": "palette-classic" }, "custom": { "lineWidth": 2 } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "id": 2,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" } },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({app=\"eventticketing\", service=\"booking-service\"} |= \"FeignException\"[1m]))",
              "legendFormat": "feign-exceptions/min",
              "refId": "A"
            },
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({app=\"eventticketing\", service=\"booking-service\"} |= \"feign\" != \"FeignException\"[1m]))",
              "legendFormat": "feign-ok/min",
              "refId": "B"
            }
          ],
          "title": "Feign Call Outcomes — booking-service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "loki", "uid": "loki" },
          "description": "Saga state transition log lines for booking-service filtered by bookingId. Visualise the full saga path for a specific booking: COMPLETING → PAYMENT_PENDING → PAID (or PAYMENT_FAILED → CANCELLED).",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "id": 3,
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Ascending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=\"eventticketing\", service=\"booking-service\"} |= \"COMPLETING\" or {app=\"eventticketing\", service=\"booking-service\"} |= \"PAYMENT_PENDING\" or {app=\"eventticketing\", service=\"booking-service\"} |= \"PAYMENT_FAILED\" or {app=\"eventticketing\", service=\"booking-service\"} |= \"REFUNDED\"",
              "legendFormat": "",
              "refId": "A"
            }
          ],
          "title": "Saga State Transitions — booking-service",
          "type": "logs"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "HTTP request rate for booking-service.",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 16 },
          "id": 4,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_count{job=\"booking-service\"}[1m]))",
              "legendFormat": "requests/sec",
              "refId": "A"
            }
          ],
          "title": "HTTP Request Rate — booking-service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "JVM heap memory usage for booking-service.",
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 16 },
          "id": 5,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_memory_used_bytes{job=\"booking-service\", area=\"heap\"}",
              "legendFormat": "heap used",
              "refId": "A"
            }
          ],
          "title": "JVM Heap Usage — booking-service",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "description": "Active database connections for booking-service.",
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 16 },
          "id": 6,
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "hikaricp_connections_active{job=\"booking-service\"}",
              "legendFormat": "active connections",
              "refId": "A"
            }
          ],
          "title": "Active DB Connections — booking-service",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["booking-service", "logql", "promql"],
      "templating": { "list": [] },
      "time": { "from": "now-1h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Booking Service Dashboard",
      "uid": "booking-service-dashboard",
      "version": 1
    }

