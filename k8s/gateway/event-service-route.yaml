apiVersion: v1
kind: ConfigMap
metadata:
  name: event-service-route
  namespace: eventticketing
data:
  # Spring Cloud Gateway route for event-service.
  # Merge this entry into the api-gateway application.yml routes list.
  route.yaml: |
    - id: event-service
      uri: http://event-service:8080
      predicates:
        - Path=/api/events/**
