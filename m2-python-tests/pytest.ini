[pytest]
# Milestone 2 — Integration & E2E Test Suite Configuration

# Default test discovery
testpaths = tests

# Show short test summary for all outcomes
addopts =
    -v
    --tb=short
    --timeout=30
    -p no:warnings

# Custom markers (avoids PytestUnknownMarkWarning)
markers =
    slow: mark test as slow (takes > 5 seconds)
    integration: mark as integration test requiring live services
    db: mark as requiring a specific database
