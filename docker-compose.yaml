services:
  db:
    image: postgres:latest
    container_name: eventticketing-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventticketingdb
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d eventticketingdb" ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata: