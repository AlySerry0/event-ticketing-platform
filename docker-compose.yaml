services:
  db:
    image: postgres:latest
    container_name: eventticketing-db
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventticketingdb
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: