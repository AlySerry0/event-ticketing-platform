  cassandra:
    image: cassandra:5.0
    container_name: eventticketing-cassandra
    ports:
      - "9042:9042"

    environment:
      CASSANDRA_CLUSTER_NAME: M2GraderCluster
      CASSANDRA_ENDPOINT_SNITCH: SimpleSnitch
      CASSANDRA_DC: datacenter1
      CASSANDRA_RACK: rack1
      MAX_HEAP_SIZE: 1024M
      HEAP_NEWSIZE: 200M
      CASSANDRA_NUM_TOKENS: 1
      CASSANDRA_AUTHENTICATOR: AllowAllAuthenticator

      JVM_EXTRA_OPTS: >-
        -Dcassandra.skip_wait_for_gossip_to_settle=0
        -Dcassandra.consistent.rangemovement=false
        -Dcassandra.ring_delay_ms=1000
        -Dcassandra.write_request_timeout_in_ms=30000
        -Dcassandra.skip_jvm_check=true
        -Djna.tmpdir=/var/lib/cassandra/tmp
        -Djava.io.tmpdir=/var/lib/cassandra/tmp

    volumes:
      - cassandra-data:/var/lib/cassandra

    command: >
      bash -c "
        mkdir -p /var/lib/cassandra/tmp &&
        export JVM_OPTS=\"\$JVM_OPTS -Djna.tmpdir=/var/lib/cassandra/tmp -Djava.io.tmpdir=/var/lib/cassandra/tmp\" &&
        exec /usr/local/bin/docker-entrypoint.sh cassandra -f
      "

    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  rabbitmq:
    image: rabbitmq:3-management
    container_name: eventticketing-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Application Services ────────────────────────────────────

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventticketingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_RABBITMQ_HOST: rabbitmq
      FEIGN_BOOKING_SERVICE_URL: http://booking-service:8080
      JWT_SECRET: "XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw="
      JWT_EXPIRATION_MS: "86400000"
      TZ: Africa/Cairo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  event-service:
    build: ./event-service
    container_name: event-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventticketingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      JWT_SECRET: "XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw="
      JWT_EXPIRATION_MS: "86400000"
      TZ: Africa/Cairo
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
  booking-service:
    build: ./booking-service
    container_name: booking-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventticketingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_NEO4J_URI: bolt://neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4jpass
      JWT_SECRET: "XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw="
      JWT_EXPIRATION_MS: "86400000"
      TZ: Africa/Cairo
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventticketingdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redispass
      SPRING_CASSANDRA_CONTACT_POINTS: cassandra
      SPRING_CASSANDRA_PORT: "9042"
      SPRING_CASSANDRA_LOCAL_DATACENTER: datacenter1
      SPRING_CASSANDRA_KEYSPACE_NAME: eventticketingks
      SPRING_CASSANDRA_SCHEMA_ACTION: CREATE_IF_NOT_EXISTS
      JWT_SECRET: "XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw="
      JWT_EXPIRATION_MS: "86400000"
      TZ: Africa/Cairo
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  sales-service:
    build: ./sales-service
    container_name: sales-service
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eventticketingdb
      SPRING_DATA_MONGODB_URI: mongodb://root:rootpass@mongo:27017/eventticketingmongo?authSource=admin
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: redispass
      JWT_SECRET: "XTAA/1w8x3EU1gymE8NZpczBPdPcPeT3UpsSA2I+Utw="
      JWT_EXPIRATION_MS: "86400000"
      TZ: Africa/Cairo
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure


volumes:
  pgdata:
  mongo-data:
  es-data:
  neo4j-data:
  cassandra-data:
  rabbitmq-data: